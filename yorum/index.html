<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTO54 – Google'da yorum yazın</title>
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="2;url=https://g.page/r/CZPgMtFJvW_UEBM/review">
<link rel="canonical" href="https://auto54.com.tr/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--green:#1d7a3c;--ink:#1b1f1d;--muted:#5b6560;--bg:#f7f9f8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px 16px;text-align:center}
  .logo{font-weight:900;font-size:1.6rem;letter-spacing:-.5px;margin-bottom:18px}
  .logo span{color:var(--green)}
  .stars{color:#f5b301;font-size:1.8rem;letter-spacing:4px;margin-bottom:10px}
  h1{font-size:1.25rem;margin-bottom:8px}
  p{color:var(--muted);margin-bottom:20px}
  .btn-dir{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:12px;background:linear-gradient(135deg,#fff 0%,#eef6f1 100%);border:1px solid #cfe3d6;color:var(--ink);text-decoration:none;box-shadow:0 1px 2px rgba(16,40,24,.06),0 6px 16px -6px rgba(29,122,60,.25);min-width:280px}
  .dir-ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#28a052 0%,#1d7a3c 45%,#145a2b 100%)}
  .dir-tx{display:flex;flex-direction:column;line-height:1.2;text-align:left}
  .dir-tx b{font-size:1.05rem;font-weight:800}
  .dir-tx small{font-size:.84rem;font-weight:600;color:#3d4843;margin-top:2px}
  .dir-go{color:#1d7a3c;margin-left:auto}
</style>
</head>
<body>
<main>
  <div class="logo">AUTO<span>54</span></div>
  <div class="stars" aria-hidden="true">★★★★★</div>
  <h1>Teşekkürler! Google yorum sayfasına yönlendiriliyorsunuz…</h1>
  <p>Sayfa açılmazsa aşağıdaki butona dokunun.</p>
  <a class="btn-dir" href="https://g.page/r/CZPgMtFJvW_UEBM/review"><span class="dir-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2-6.2 3.2 1.2-6.8-5-4.9 6.9-1z"/></svg></span><span class="dir-tx"><b>Google'da yorum yazın</b><small>Google yorum sayfası açılır</small></span><svg class="dir-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</main>
<!-- GoatCounter: yorum linki tıklamasını say (JS'siz piksel) -->
<noscript><img src="https://malik.goatcounter.com/count?p=/yorum&amp;t=Yorum%20linki" alt="" width="1" height="1" style="position:absolute;left:-9999px"></noscript>
<script>
/* Kaynak etiketi: /yorum?k=kartvizit -> GoatCounter'da /yorum/kartvizit olarak sayılır */
(function(){
  var k=(new URLSearchParams(location.search).get('k')||'').replace(/[^a-z0-9-]/gi,'').slice(0,30);
  var path='/yorum'+(k?'/'+k:'');
  var img=new Image(1,1);img.src='https://malik.goatcounter.com/count?p='+encodeURIComponent(path)+'&t='+encodeURIComponent('Yorum linki');
  setTimeout(function(){location.replace('https://g.page/r/CZPgMtFJvW_UEBM/review');},400);
})();
</script>
</body>
</html>
